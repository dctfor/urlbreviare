<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Meta tags for SEO -->
    <meta name="description" content="Inicia sesión para acortar tus URLs de manera fácil y rápida.">
    <meta name="keywords" content="login, iniciar sesión, acortador, URL">
    <!-- Favicon -->
    <!-- <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon"> -->
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <style>
        body {
            background-color: #f8f9fa;
        }
        .dark-mode {
            background-color: #121212;
            color: #ffffff;
        }
        .dark-mode .card {
            background-color: #1e1e1e;
        }
        .dark-mode .form-control {
            background-color: #1e1e1e;
            color: #ffffff;
        }
        /* Additional styles */
    </style>
</head>
<body>
    <div class="d-flex align-items-center min-vh-100">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h2 class="text-center mb-4">Iniciar Sesión</h2>
                            <form id="loginForm">
                                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                                <div class="mb-3">
                                    <label for="username" class="form-label">Nombre de Usuario</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-person-circle"></i></span>
                                        <input type="text" class="form-control" id="username" name="username" required>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label for="password" class="form-label">Contraseña</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                                        <input type="password" class="form-control" id="password" name="password" required>
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">Iniciar Sesión</button>
                            </form>
                            <!-- Error Message -->
                            <div id="error" class="mt-3 d-none">
                                <div class="alert alert-danger alert-dismissible fade show" role="alert">
                                    <i class="bi bi-exclamation-triangle-fill"></i> <span id="errorMessage"></span>
                                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
                                </div>
                            </div>
                            <!-- <p class="text-center mt-3">¿No tienes una cuenta? <a href="/register">Regístrate aquí</a></p> -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Optional: Include background image or color -->
    <!-- Bootstrap JS and dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- JavaScript personalizado -->
    <script nonce="{{ csp_nonce() }}">
        document.addEventListener('DOMContentLoaded', function () {
            const form = document.getElementById('loginForm');
            const errorDiv = document.getElementById('error');
            const errorMessage = document.getElementById('errorMessage');

            form.addEventListener('submit', async function (e) {
                e.preventDefault();
                errorDiv.classList.add('d-none');
                errorMessage.textContent = '';

                const usernameInput = document.getElementById('username');
                const passwordInput = document.getElementById('password');
                const csrfToken = document.querySelector('input[name="csrf_token"]').value;

                // Simple client-side validation
                if (!usernameInput.value.trim() || !passwordInput.value.trim()) {
                    errorMessage.textContent = 'Por favor, completa todos los campos.';
                    errorDiv.classList.remove('d-none');
                    return;
                }

                try {
                    const response = await fetch('/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': csrfToken
                        },
                        body: JSON.stringify({
                            username: usernameInput.value.trim(),
                            password: passwordInput.value.trim()
                        })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        // Redirect to the main page or dashboard
                        window.location.href = '/';
                    } else {
                        throw new Error(data.message || 'Ocurrió un error al iniciar sesión.');
                    }
                } catch (error) {
                    errorMessage.textContent = error.message;
                    errorDiv.classList.remove('d-none');
                }
            });
        });
    </script>
</body>
</html>
