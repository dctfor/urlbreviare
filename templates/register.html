<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Usuario</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2 class="text-center mb-4">Registrar Usuario</h2>
        <div class="row justify-content-center">
            <div class="col-md-6">
                <form id="registerForm">
                    <div class="mb-3">
                        <label for="username" class="form-label">Nombre de Usuario</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Registrar</button>
                </form>
                <!-- Mensaje de Éxito -->
                <div id="success" class="mt-3 d-none">
                    <div class="alert alert-success" role="alert">
                        Usuario registrado exitosamente. <a href="/login">Iniciar Sesión</a>
                    </div>
                </div>
                <!-- Mensaje de Error -->
                <div id="error" class="mt-3 d-none">
                    <div class="alert alert-danger" role="alert" id="errorMessage">
                        <!-- Mensaje de error dinámico -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS y dependencias (Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- JavaScript personalizado -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const form = document.getElementById('registerForm');
            const successDiv = document.getElementById('success');
            const errorDiv = document.getElementById('error');
            const errorMessage = document.getElementById('errorMessage');

            form.addEventListener('submit', async function (e) {
                e.preventDefault();
                successDiv.classList.add('d-none');
                errorDiv.classList.add('d-none');
                errorMessage.textContent = '';

                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value.trim();

                try {
                    const response = await fetch('/register', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ username: username, password: password })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        successDiv.classList.remove('d-none');
                        form.reset();
                    } else {
                        throw new Error(data.message || 'Ocurrió un error al registrar el usuario.');
                    }
                } catch (error) {
                    errorMessage.textContent = error.message;
                    errorDiv.classList.remove('d-none');
                }
            });
        });
    </script>
</body>
</html>
